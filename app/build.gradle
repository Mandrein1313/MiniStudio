plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dev.ministudio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dev.ministudio'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // ไลบรารี JGit (อัพเดทเวอร์ชัน + แก้ปัญหา Duplicate Kotlin)
    implementation('org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    
    // ไลบรารีจำเป็นสำหรับ FileProvider
    implementation 'androidx.core:core:1.10.1'
    
    // Kotlin stdlib (เวอร์ชันใหม่กว่าเพื่อความเสถียร)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
    
    // ทดสอบ (เพิ่มกลับมาเพื่อความสมบูรณ์)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
